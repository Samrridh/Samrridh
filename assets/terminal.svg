<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <style>
    .bg { fill: #0d1117; }
    .border { fill: none; stroke: #30363d; stroke-width: 1; }
    .dot1 { fill: #ff5f56; } .dot2 { fill: #ffbd2e; } .dot3 { fill: #27c93f; }
    .txt { fill: #c9d1d9; font: 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .muted { fill: #8b949e; }
    .accent { fill: #f0f6fc; font-weight: 600; }
    .line { opacity: 0; animation: show 8s infinite; }
    .l1 { animation-delay: .4s; } .l2 { animation-delay: 1.8s; } .l3 { animation-delay: 3.6s; } .l4 { animation-delay: 5.4s; }
    .cursor { fill: #c9d1d9; animation: blink 1s steps(1) infinite; }
    @keyframes show { 0%,8%{opacity:0} 12%,86%{opacity:1} 92%,100%{opacity:0} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; } .border { stroke: #d0d7de; } .txt { fill: #24292f; }
      .muted { fill: #57606a; } .accent { fill: #0d1117; } .cursor { fill: #24292f; }
    }
  </style>
  <rect x="1" y="1" width="898" height="228" rx="14" class="bg"/>
  <rect x="1.5" y="1.5" width="897" height="227" rx="13.5" class="border"/>
  <circle cx="28" cy="25" r="5" class="dot1"/><circle cx="46" cy="25" r="5" class="dot2"/><circle cx="64" cy="25" r="5" class="dot3"/>
  <text x="24" y="72" class="txt line l1"><tspan class="muted">$</tspan> whoami</text>
  <text x="24" y="99" class="txt line l2"><tspan class="accent">samrridh</tspan><tspan class="muted"> — builder of AI systems and developer tools</tspan></text>
  <text x="24" y="140" class="txt line l3"><tspan class="muted">$</tspan> current --focus</text>
  <text x="24" y="167" class="txt line l4"><tspan class="accent">AI memory</tspan><tspan class="muted"> · agents · retrieval · infrastructure</tspan></text>
  <rect x="24" y="190" width="9" height="18" rx="1" class="cursor"/>
</svg>
